# Nginx config for drive.hkbkce.in
# Place this in: /etc/nginx/sites-available/drive.hkbkce.in
# Then: sudo ln -s /etc/nginx/sites-available/drive.hkbkce.in /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl;
    server_name drive.hkbkce.in;

    # SSL certs (update paths if needed)
    # ssl_certificate     /etc/letsencrypt/live/drive.hkbkce.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/drive.hkbkce.in/privkey.pem;

    # Proxy ALL requests to Node.js (Node serves both static files and API)
    location / {
        proxy_pass         http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Allow large video uploads (up to 2GB)
        client_max_body_size 2048M;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }
}
